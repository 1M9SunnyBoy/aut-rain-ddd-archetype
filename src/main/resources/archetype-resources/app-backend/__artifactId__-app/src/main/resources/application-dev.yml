#set( $dollar = '$' )
#set( $hash = '#' )
${hash} description: 配置本机开发端口、数据库连接与 Flyway。
${hash} author: zzy
${hash} created: 2026-10-19
server:
  port: ${dollar}{SERVER_PORT:8080}
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${dollar}{APP_DB_URL:jdbc:mysql://127.0.0.1:13306/${databaseName}?characterEncoding=UTF-8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${dollar}{APP_DB_USERNAME:root}
    password: ${dollar}{APP_DB_PASSWORD:123456}
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
logging:
  level:
    root: INFO
