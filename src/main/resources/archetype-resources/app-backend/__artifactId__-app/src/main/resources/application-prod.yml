#set( $dollar = '$' )
#set( $hash = '#' )
${hash} description: 从外部变量读取生产数据库凭据并启用版本迁移。
${hash} author: zzy
${hash} created: 2026-10-19
server:
  port: ${dollar}{SERVER_PORT:8080}
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${dollar}{APP_DB_URL}
    username: ${dollar}{APP_DB_USERNAME}
    password: ${dollar}{APP_DB_PASSWORD}
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
