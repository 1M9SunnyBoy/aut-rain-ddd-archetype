#set( $databaseName = $artifactId.replace('-', '_') )
#end
#set( $dollar = '$' )
#set( $hash = '#' )
${hash} 独立开发环境，在本目录使用 Windows PowerShell 执行：
${hash} docker compose -f docker-compose.dev.yml up -d --wait
${hash} Docker Desktop 使用 Linux containers；主机无需执行 Bash/chmod。
${hash} Nacos：http://127.0.0.1:18080（首次初始化 nacos 管理员）
${hash} XXL-Job：http://127.0.0.1:19090/xxl-job-admin（admin / 123456）
${hash} phpMyAdmin：http://127.0.0.1:18899（root / 123456）
${hash} Redis Commander：http://127.0.0.1:18081（admin / admin）
${hash} RocketMQ Dashboard：http://127.0.0.1:18082（仅本机，无预置登录）
${hash} 后端 8080、Vite 5137 在 Windows 本机运行。本文件不与生产 Compose 合并。
name: autrain-app

services:
  ${hash} 注册与配置中心。3.x 控制台独立端口；开发使用 Derby，数据保存在 nacos-data。
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: nacos
    restart: unless-stopped
    ports:
      - "127.0.0.1:18848:8848"
      - "127.0.0.1:19848:9848"
      - "127.0.0.1:19849:9849"
      - "127.0.0.1:${dollar}{NACOS_CONSOLE_PORT:-18080}:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${dollar}{NACOS_AUTH_TOKEN:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: "18000"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${dollar}{NACOS_AUTH_IDENTITY_VALUE:-dev-server-identity}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8848 && echo > /dev/tcp/127.0.0.1/9848 && echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ${hash} 任务调度中心。沿用脚手架 2.4.1 与匹配 SQL。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: -xxl-job-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${dollar}{XXL_JOB_PORT:-19090}:9090"
    environment:
      SERVER_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${dollar}{MYSQL_ROOT_PASSWORD:-123456}
      XXL_JOB_ACCESS_TOKEN: ${dollar}{XXL_JOB_ACCESS_TOKEN:-default_token}
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    volumes:
      - xxl-job-logs:/data/applogs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9090'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ${hash} 数据库。命名卷替代数据容器和 Windows 主机数据目录挂载。
  mysql:
    image: mysql:8.0.32
    hostname: mysql
    container_name: -mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${dollar}{MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${databaseName}
      MYSQL_USER: ${databaseName}
      MYSQL_PASSWORD: ${dollar}{MYSQL_PASSWORD:-123456}
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${dollar}{MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/sql/00-project.sql:/docker-entrypoint-initdb.d/00-project.sql:ro
      - ./mysql/sql/xxl-job.sql:/docker-entrypoint-initdb.d/xxl-job.sql:ro
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"${dollar}${dollar}MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u ${databaseName} -D ${databaseName} -Nse 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  ${hash} 数据库管理界面。默认使用 root / 123456 登录。
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: -phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${dollar}{PHPMYADMIN_PORT:-18899}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - autrain-network

  ${hash} Redis 管理界面。HTTP 登录密码与 Redis 服务密码独立。
  redis-admin:
    image: spryker/redis-commander:0.8.0
    container_name: -redis-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${dollar}{REDIS_ADMIN_PORT:-18081}:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HTTP_USER: admin
      HTTP_PASSWORD: ${dollar}{REDIS_ADMIN_PASSWORD:-admin}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autrain-network

  ${hash} 缓存。AOF 持久化，开发无密码；仅映射本机回环地址。
  redis:
    image: redis:6.2
    container_name: -redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${dollar}{REDIS_PORT:-16379}:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--protected-mode", "no"]
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  ${hash} 消息服务。使用官方镜像分别启动 NameServer 和 Broker。
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.0
    container_name: -rocketmq-namesrv
    restart: unless-stopped
    user: root
    command: ["sh", "mqnamesrv"]
    ports:
      - "127.0.0.1:19876:9876"
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ${hash} 本机客户端使用 127.0.0.1 广播地址。Broker 监听及广播 20911（VIP 20909、HA 20912），Dashboard 发布为 18082。
  rocketmq-broker:
    image: apache/rocketmq:5.1.0
    container_name: -rocketmq-broker
    restart: unless-stopped
    user: root
    ports:
      - "127.0.0.1:20909:20909"
      - "127.0.0.1:20911:20911"
      - "127.0.0.1:20912:20912"
      - "127.0.0.1:${dollar}{ROCKETMQ_DASHBOARD_PORT:-18082}:8080"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      BROKER_ADVERTISE_HOST: 127.0.0.1
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    command:
      - sh
      - -c
      - |
        cp /etc/rocketmq/broker.conf /tmp/broker.conf
        printf '\nbrokerIP1=%s\n' "${dollar}${dollar}BROKER_ADVERTISE_HOST" >> /tmp/broker.conf
        printf 'listenPort=20911\nhaListenPort=20912\n' >> /tmp/broker.conf
        exec sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/etc/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s

  ${hash} 共享 Broker 网络，使 Dashboard 也能访问广播的 127.0.0.1；没有独立端口映射。
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: -rocketmq-dashboard
    restart: unless-stopped
    network_mode: service:rocketmq-broker
    environment:
      JAVA_OPTS: -Xms128m -Xmx256m -Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Drocketmq.config.isVIPChannel=false
    depends_on:
      rocketmq-broker:
        condition: service_healthy

networks:
  autrain-network:
    name: autrain-network
    driver: bridge

volumes:
  mysql-data: {}
  redis-data: {}
  nacos-data: {}
  nacos-logs: {}
  rocketmq-namesrv-logs: {}
  rocketmq-broker-logs: {}
  rocketmq-store: {}
  xxl-job-logs: {}
