#set( $databaseName = $artifactId.replace('-', '_') )
#end
#set( $dollar = '$' )
#set( $hash = '#' )
${hash} description: 与生产环境配置合并，部署后端和前端 Nginx。
${hash} author: zzy
${hash} created: 2026-10-19
${hash} 应用部署：与 environment/docker-compose.yml 合并使用，相对路径以 environment 目录为基准。
${hash} 使用 app/sh 或 app/psw 中的 build/start/stop；不要叠加开发 Compose。
name: ${artifactId}

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  app:
    image: ${artifactId}/app:${dollar}{IMAGE_TAG:-latest}
    build:
      context: ../../../app-backend/${artifactId}-app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      APP_DB_URL: jdbc:mysql://mysql:3306/${databaseName}?characterEncoding=UTF-8&connectionTimeZone=UTC
      APP_DB_USERNAME: ${databaseName}
      APP_DB_PASSWORD: ${dollar}{MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      LOG_PATH: /tmp/logs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      TZ: Asia/Shanghai
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging

  nginx:
    image: ${artifactId}/web:${dollar}{IMAGE_TAG:-latest}
    build:
      context: ../../..
      dockerfile: docs/dev-ops/environment/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${dollar}{HTTP_BIND:-0.0.0.0}:${dollar}{HTTP_PORT:-${httpPort}}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - autrain-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

networks:
  autrain-network:
    name: autrain-network
    driver: bridge
